<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0D0F14;
    --panel:#161922;
    --panel2:#1C2029;
    --border:#2A2E3A;
    --text:#E8E6E1;
    --text-dim:#8B8F9C;
    --accent:#D4A24C;
    --accent2:#5FA8A0;
    --danger:#D4694C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px;}
  .lang-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    padding:5px 12px;
    border-radius:5px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .lang-btn:hover{opacity:.85;}
  .lang-btn.active{background:var(--accent);color:#141414;border-color:var(--accent);}

  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px;}
  .brand svg{display:block;}
  .cursor-blink{animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .wordmark{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:700;
    letter-spacing:.01em;
    margin-top:10px;
  }
  .wordmark .slash{color:var(--accent);}
  .tagline{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-top:4px;
  }

  header{margin-bottom:22px;text-align:center;}
  header h1{font-size:21px;margin:0 0 8px;font-weight:600;}
  header p{color:var(--text-dim);font-size:14px;margin:0 auto;line-height:1.55;max-width:620px;}

  .grid{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .col{flex:1 1 380px;min-width:320px;}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 6px;
  }
  .card .subhint{font-size:12px;color:var(--text-dim);line-height:1.5;margin:0 0 14px;}

  label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], textarea, select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px;
    resize:vertical;
  }
  textarea{min-height:64px;line-height:1.4;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .checks{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .check-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);}
  .check-row input{width:auto;accent-color:var(--accent);margin-top:2px;}
  .check-row .desc{display:block;font-size:11.5px;color:var(--text-dim);margin-top:1px;}

  pre#tree{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    line-height:1.65;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:14px 16px;
    white-space:pre;
    overflow-x:auto;
    color:var(--text-dim);
    margin:0;
    max-height:360px;
    overflow-y:auto;
  }
  pre#tree .folder{color:var(--accent);}
  pre#tree .file{color:var(--accent2);}
  pre#tree .root{color:var(--text);font-weight:700;}

  textarea#promptOut{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    min-height:230px;
    line-height:1.5;
    color:var(--text);
  }

  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    border-radius:6px;
    padding:10px 16px;
    border:1px solid transparent;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.85;}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);color:#141414;}
  .btn-secondary{background:transparent;border-color:var(--border);color:var(--text);}
  .hint{font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.5;}
  .status{font-size:12px;color:var(--accent2);margin-top:8px;min-height:16px;}

  .info-box{
    background:var(--panel2);
    border:1px solid var(--border);
    border-left:3px solid var(--accent2);
    border-radius:6px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
    margin-top:14px;
  }
  .info-box b{color:var(--text);}
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar">
    <button type="button" class="lang-btn" id="langPt">PT</button>
    <button type="button" class="lang-btn" id="langEn">EN</button>
  </div>

  <div class="brand">
    <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="8" width="30" height="38" rx="5" fill="#161922" stroke="#2A2E3A" stroke-width="1.5"/>
      <rect x="13" y="13" width="30" height="38" rx="5" fill="#161922" stroke="#5FA8A0" stroke-width="1.5"/>
      <rect x="6" y="18" width="30" height="38" rx="5" fill="#1C2029" stroke="#D4A24C" stroke-width="2"/>
      <text x="13" y="34" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#D4A24C">&gt;</text>
      <rect x="12" y="40" width="16" height="2.4" rx="1.2" fill="#8B8F9C"/>
      <rect x="12" y="45" width="10" height="2.4" rx="1.2" fill="#8B8F9C"/>
      <rect class="cursor-blink" x="24" y="45" width="6" height="2.4" rx="1" fill="#D4A24C"/>
    </svg>
    <div class="wordmark">workspace<span class="slash">//</span>kit</div>
    <div class="tagline" id="tagline"></div>
  </div>

  <header>
    <h1 id="headerH1"></h1>
    <p id="headerP"></p>
  </header>

  <div class="grid">
    <div class="col">
      <div class="card">
        <h2 id="card01Title"></h2>
        <label for="pname" id="pnameLabel"></label>
        <input type="text" id="pname">

        <label for="ptype" id="ptypeLabel"></label>
        <select id="ptype"></select>

        <label for="pdesc" id="pdescLabel"></label>
        <textarea id="pdesc" style="font-family:'Inter',sans-serif;font-size:14px;"></textarea>

        <label for="pobj" id="pobjLabel"></label>
        <input type="text" id="pobj">

        <label id="checksTitle" for="chk1"></label>
        <div class="checks" id="typeChecks">
          <div class="check-row"><input type="checkbox" id="chk1"><label id="chk1label" for="chk1" style="margin:0"></label></div>
          <div class="check-row"><input type="checkbox" id="chk2"><label id="chk2label" for="chk2" style="margin:0"></label></div>
          <div class="check-row"><input type="checkbox" id="chk3"><label id="chk3label" for="chk3" style="margin:0"></label></div>
        </div>
      </div>

      <div class="card">
        <h2 id="card02Title"></h2>
        <p class="subhint" id="card02Sub"></p>
        <label for="pstack" id="pstackLabel"></label>
        <textarea id="pstack"></textarea>

        <label for="plimits" id="plimitsLabel"></label>
        <textarea id="plimits"></textarea>
      </div>

      <div class="card">
        <h2 id="card03Title"></h2>
        <p class="subhint" id="card03Sub"></p>
        <div class="checks">
          <div class="check-row"><input type="checkbox" id="agClaude" checked><label style="margin:0" for="agClaude"><span id="agClaudeLabel"></span> <span class="desc">CLAUDE.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agAgentsmd" checked><label style="margin:0" for="agAgentsmd"><span id="agAgentsmdLabel"></span> <span class="desc" id="agAgentsmdDesc"></span></label></div>
          <div class="check-row"><input type="checkbox" id="agCursor"><label style="margin:0" for="agCursor"><span id="agCursorLabel"></span> <span class="desc">.cursor/rules/{slug}.mdc</span></label></div>
          <div class="check-row"><input type="checkbox" id="agCopilot"><label style="margin:0" for="agCopilot"><span id="agCopilotLabel"></span> <span class="desc">.github/copilot-instructions.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agGemini"><label style="margin:0" for="agGemini"><span id="agGeminiLabel"></span> <span class="desc">GEMINI.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agWindsurf"><label style="margin:0" for="agWindsurf"><span id="agWindsurfLabel"></span> <span class="desc">.windsurf/rules/{slug}.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agSkill"><label style="margin:0" for="agSkill"><span id="agSkillLabel"></span> <span class="desc">.claude/skills/{slug}/SKILL.md</span></label></div>
        </div>
        <div class="info-box" id="infoBox"></div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2 id="card04Title"></h2>
        <pre id="tree"></pre>
        <div class="actions">
          <button class="btn-primary" id="btnZip"></button>
        </div>
        <div class="status" id="zipStatus"></div>
      </div>

      <div class="card">
        <h2 id="card05Title"></h2>
        <textarea id="promptOut" readonly></textarea>
        <div class="actions">
          <button class="btn-secondary" id="btnCopy"></button>
        </div>
        <div class="hint" id="promptHint"></div>
      </div>
    </div>
  </div>
</div>

<script>
let LANG = 'en';

const UI = {
  en: {
    tagline: 'multi-agent workspace generator',
    h1: 'Build a workspace ready for any AI agent',
    p: 'Describe the project and generate, in one go, the human context layer (PROJECT.md, DECISIONS.md...) and the AI instruction layer — in the right format for whichever tool you use.',
    card01: '01 · Project',
    pnameLabel: 'Project name',
    pnamePh: 'e.g. Infinite List',
    ptypeLabel: 'Project type',
    pdescLabel: 'Brief description',
    pdescPh: 'What the project is about, in 2-3 sentences.',
    pobjLabel: 'Main goal (optional)',
    pobjPh: 'e.g. validate whether the app is viable before coding',
    checksTitle: 'Workspace folders',
    card02: '02 · Technical context',
    card02sub: 'This becomes the body of the instruction files (CLAUDE.md/AGENTS.md etc.) — the more concrete, the less the AI gets conventions wrong.',
    pstackLabel: 'Stack & commands',
    genericPh: 'filled in based on the project type',
    plimitsLabel: 'Limits — what the AI should not do without asking',
    card03: '03 · Agent layer',
    card03sub: 'Choose which AIs to generate an instruction file for. Each one reads a different name and format at the workspace root.',
    agClaude: 'Claude Code / Cowork',
    agAgentsmd: 'Universal standard',
    agAgentsmdDesc: 'AGENTS.md — read by Codex, Cursor, Windsurf, Gemini CLI, Devin, Amazon Q and others',
    agCursor: 'Cursor (dedicated rule)',
    agCopilot: 'GitHub Copilot',
    agGemini: 'Gemini CLI',
    agWindsurf: 'Windsurf',
    agSkill: 'Portable Skill skeleton',
    infoBox: '<b>Why two files by default?</b> CLAUDE.md and AGENTS.md hold the same content, but serve different audiences: AGENTS.md is the open format most tools already read natively; CLAUDE.md is what Claude Code/Cowork loads before each session. With both checked, CLAUDE.md just imports AGENTS.md (<code>@AGENTS.md</code>) and leaves room for rules exclusive to Claude — without duplicating text.',
    card04: '04 · Workspace structure',
    btnZip: 'Download workspace .zip',
    card05: '05 · Starter prompt',
    btnCopy: 'Copy prompt',
    copied: 'Copied!',
    promptHint: 'Paste this as the first message, after uploading the .zip files into the agent\'s working folder.',
    zipGenerating: 'Generating .zip...',
    zipDone: (slug)=>`Downloaded: ${slug}.zip`,
    zipError: (msg)=>`Error generating .zip: ${msg}`,
    agentListFallback: 'the context files in the root folder',
    newProject: 'New project',
    fillIn: '(fill in)',
    localOnlyTag: '· local only (.gitignore)',
  },
  pt: {
    tagline: 'gerador de workspaces multi-agente',
    h1: 'Monte um workspace pronto pra qualquer agente de IA',
    p: 'Descreva o projeto e gere, de uma vez, a camada de contexto pra humano (PROJECT.md, DECISIONS.md...) e a camada de instruções pra IA — no formato certo pra cada ferramenta que você usa.',
    card01: '01 · Projeto',
    pnameLabel: 'Nome do projeto',
    pnamePh: 'Ex: A Lista Infinita',
    ptypeLabel: 'Tipo de projeto',
    pdescLabel: 'Descrição breve',
    pdescPh: 'Do que se trata o projeto, em 2-3 frases.',
    pobjLabel: 'Objetivo principal (opcional)',
    pobjPh: 'Ex: validar se o app é viável antes de codar',
    checksTitle: 'Pastas do workspace',
    card02: '02 · Contexto técnico',
    card02sub: 'Isso vira o corpo dos arquivos de instrução (CLAUDE.md/AGENTS.md etc.) — quanto mais concreto, menos a IA erra convenção.',
    pstackLabel: 'Stack & comandos',
    genericPh: 'preenchido conforme o tipo de projeto',
    plimitsLabel: 'Limites — o que a IA não deve fazer sem perguntar',
    card03: '03 · Camada de agentes',
    card03sub: 'Escolha pra quais IAs gerar arquivo de instrução. Cada uma lê um nome e formato diferente na raiz do workspace.',
    agClaude: 'Claude Code / Cowork',
    agAgentsmd: 'Padrão universal',
    agAgentsmdDesc: 'AGENTS.md — lido por Codex, Cursor, Windsurf, Gemini CLI, Devin, Amazon Q e outros',
    agCursor: 'Cursor (regra dedicada)',
    agCopilot: 'GitHub Copilot',
    agGemini: 'Gemini CLI',
    agWindsurf: 'Windsurf',
    agSkill: 'Esqueleto de Skill portátil',

    card04: '04 · Estrutura do workspace',
    btnZip: 'Baixar .zip do workspace',
    card05: '05 · Prompt inicial',
    btnCopy: 'Copiar prompt',
    copied: 'Copiado!',
    promptHint: 'Cole isso na primeira mensagem, depois de subir os arquivos do .zip na pasta de trabalho do agente.',
    zipGenerating: 'Gerando .zip...',
    zipDone: (slug)=>`Baixado: ${slug}.zip`,
    zipError: (msg)=>`Erro ao gerar o .zip: ${msg}`,
    agentListFallback: 'os arquivos de contexto na raiz',
    newProject: 'Novo projeto',
    fillIn: '(preencher)',
    localOnlyTag: '· só local (.gitignore)',
  }
};

const TYPE_CONFIG = {
  produto: {
    label:{en:'Digital product / App', pt:'Produto digital / App'},
    checks:[
      {label:{en:'Research / discovery', pt:'Pesquisa / discovery'}, folder:{en:'research', pt:'pesquisa'}},
      {label:{en:'Design / assets', pt:'Design / assets'}, folder:{en:'design', pt:'design'}},
      {label:{en:'Code (/src)', pt:'Código (/src)'}, folder:{en:'src', pt:'src'}}
    ],
    defaults:[true,true,true],
    stackPh:{en:'e.g. Tauri v2 + React + SQLite · pnpm · tests with vitest', pt:'Ex: Tauri v2 + React + SQLite · pnpm · testes com vitest'},
    limitsPh:{en:"e.g. don't commit directly to main · don't use paid libraries without asking", pt:'Ex: não commitar direto na main · não usar libs pagas sem avisar'},
    extraFile:{path:{en:'docs/PRD.md', pt:'docs/PRD.md'}, build:(n,lang)=> lang==='en'
      ? `# PRD — ${n}\n\n## Problem\n\n## Proposed solution\n\n## Scope\n\n## Out of scope\n\n## Success metrics\n`
      : `# PRD — ${n}\n\n## Problema\n\n## Solução proposta\n\n## Escopo\n\n## Fora de escopo\n\n## Métricas de sucesso\n`}
  },
  pesquisa: {
    label:{en:'Research & analysis', pt:'Pesquisa & análise'},
    checks:[
      {label:{en:'Raw data', pt:'Dados brutos'}, folder:{en:'data', pt:'dados'}, localOnly:true},
      {label:{en:'Source notes', pt:'Notas de fontes'}, folder:{en:'notes', pt:'notas'}},
      {label:{en:'Results / outputs', pt:'Resultados / outputs'}, folder:{en:'outputs', pt:'outputs'}, localOnly:true}
    ],
    defaults:[true,true,true],
    stackPh:{en:'e.g. Python + pandas + Jupyter · dataset in /data', pt:'Ex: Python + pandas + Jupyter · dataset em /dados'},
    limitsPh:{en:'e.g. never modify raw data, only copy before processing', pt:'Ex: nunca alterar os dados brutos, só copiar antes de processar'},
  },
  escrita: {
    label:{en:'Writing & content', pt:'Escrita & conteúdo'},
    checks:[
      {label:{en:'Drafts', pt:'Rascunhos'}, folder:{en:'drafts', pt:'rascunhos'}},
      {label:{en:'References', pt:'Referências'}, folder:{en:'references', pt:'referencias'}},
      {label:{en:'Published', pt:'Publicado'}, folder:{en:'published', pt:'publicado'}}
    ],
    defaults:[true,true,false],
    stackPh:{en:'e.g. Markdown · published on Medium (PT/EN)', pt:'Ex: Markdown · publicação no Medium (PT/EN)'},
    limitsPh:{en:"e.g. keep a first-person tone · never present the AI as the text's author", pt:'Ex: manter tom em primeira pessoa · nunca apresentar a IA como autora do texto'},
  },
  design: {
    label:{en:'Design (UI/product)', pt:'Design (UI/produto)'},
    checks:[
      {label:{en:'References', pt:'Referências'}, folder:{en:'references', pt:'referencias'}},
      {label:{en:'Assets', pt:'Assets'}, folder:{en:'assets', pt:'assets'}},
      {label:{en:'Wireframes', pt:'Wireframes'}, folder:{en:'wireframes', pt:'wireframes'}}
    ],
    defaults:[true,true,true],
    stackPh:{en:'e.g. Figma as source of truth · tokens exported to /assets', pt:'Ex: Figma como fonte da verdade · tokens exportados em /assets'},
    limitsPh:{en:"e.g. don't generate final assets with AI without clearly marking them as drafts", pt:'Ex: não gerar peças finais com IA sem marcar claramente como rascunho'},
    extraFile:{path:{en:'handoff/SPEC.md', pt:'handoff/SPEC.md'}, build:(n,lang)=> lang==='en'
      ? `# Handoff spec — ${n}\n\n## Tokens\n\n## Components\n\n## States\n\n## Breakpoints\n`
      : `# Spec de handoff — ${n}\n\n## Tokens\n\n## Componentes\n\n## Estados\n\n## Breakpoints\n`}
  },
  dataml: {
    label:{en:'Data / ML pipeline', pt:'Dados / ML pipeline'},
    checks:[
      {label:{en:'Data', pt:'Dados'}, folder:{en:'data', pt:'dados'}, localOnly:true},
      {label:{en:'Notebooks', pt:'Notebooks'}, folder:{en:'notebooks', pt:'notebooks'}},
      {label:{en:'Models / outputs', pt:'Modelos / outputs'}, folder:{en:'models', pt:'modelos'}, localOnly:true}
    ],
    defaults:[true,true,true],
    stackPh:{en:'e.g. Python + PyTorch · data versioned outside git', pt:'Ex: Python + PyTorch · dados versionados fora do git'},
    limitsPh:{en:'e.g. never push the full dataset to the repository', pt:'Ex: nunca subir dataset completo pro repositório'},
  },
  automacao: {
    label:{en:'Automation / internal script', pt:'Automação / script interno'},
    checks:[
      {label:{en:'Scripts', pt:'Scripts'}, folder:{en:'scripts', pt:'scripts'}},
      {label:{en:'Configuration', pt:'Configuração'}, folder:{en:'config', pt:'config'}, localOnly:true},
      {label:{en:'Logs', pt:'Logs'}, folder:{en:'logs', pt:'logs'}, localOnly:true}
    ],
    defaults:[true,true,false],
    stackPh:{en:'e.g. Node.js + node-cron · runs via PowerShell 7', pt:'Ex: Node.js + node-cron · roda via PowerShell 7'},
    limitsPh:{en:'e.g. never commit credentials or tokens in /config', pt:'Ex: nunca commitar credenciais ou tokens em /config'},
  },
  jogo: {
    label:{en:'Digital game (game dev)', pt:'Jogo digital (game dev)'},
    checks:[
      {label:{en:'Assets', pt:'Assets'}, folder:{en:'assets', pt:'assets'}},
      {label:{en:'Builds', pt:'Builds'}, folder:{en:'builds', pt:'builds'}, localOnly:true},
      {label:{en:'Code (/src)', pt:'Código (/src)'}, folder:{en:'src', pt:'src'}}
    ],
    defaults:[true,false,true],
    stackPh:{en:'e.g. Construct 3 / Unreal Engine 5 · Blueprints only', pt:'Ex: Construct 3 / Unreal Engine 5 · só Blueprints'},
    limitsPh:{en:'e.g. single mechanic, scope of a few days · no multi-layer systems', pt:'Ex: mecânica única, escopo de poucos dias · nada de sistemas multi-camada'},
    extraFile:{path:{en:'design/GDD.md', pt:'design/GDD.md'}, build:(n,lang)=> lang==='en'
      ? `# GDD — ${n}\n\n## One-sentence concept\n\n## Core mechanic (core loop)\n\n## Scope (what fits the timeline)\n\n## Out of scope\n`
      : `# GDD — ${n}\n\n## Conceito em uma frase\n\n## Mecânica principal (core loop)\n\n## Escopo (o que cabe no prazo)\n\n## Fora de escopo\n`}
  },
  boardgame: {
    label:{en:'Board / card game', pt:'Jogo de tabuleiro / cartas'},
    checks:[
      {label:{en:'Prototypes', pt:'Protótipos'}, folder:{en:'prototypes', pt:'prototipos'}},
      {label:{en:'Playtests', pt:'Playtests'}, folder:{en:'playtests', pt:'playtests'}},
      {label:{en:'Art / components', pt:'Arte / componentes'}, folder:{en:'art', pt:'arte'}}
    ],
    defaults:[true,true,true],
    stackPh:{en:'e.g. cooperative, WWII aviation theme · print-and-play for testing', pt:'Ex: cooperativo, tema WWII aviação · print-and-play pra testar'},

function slugify(s){
  return (s || 'new-project')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/(^-|-$)/g,'') || 'new-project';
}
function todayStr(lang){ return new Date().toLocaleDateString(lang==='en' ? 'en-US' : 'pt-BR'); }

function populateTypeSelect(){
  const prevValue = els.type.value;
  els.type.innerHTML = '';
  Object.entries(TYPE_CONFIG).forEach(([key,cfg])=>{
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = cfg.label[LANG];
    els.type.appendChild(opt);
  });
  if(prevValue && TYPE_CONFIG[prevValue]) els.type.value = prevValue;
}

function applyTypeDefaults(){
  const cfg = TYPE_CONFIG[els.type.value];
  [els.chk1, els.chk2, els.chk3].forEach((el,i)=>{ el.checked = cfg.defaults[i]; });
  [els.chk1label, els.chk2label, els.chk3label].forEach((el,i)=>{
    const base = cfg.checks[i].label[LANG];
    el.textContent = cfg.checks[i].localOnly ? `${base} ${UI[LANG].localOnlyTag}` : base;
  });
  els.stack.placeholder = cfg.stackPh[LANG];
  els.limits.placeholder = cfg.limitsPh[LANG];
}
els.type.addEventListener('change', ()=>{ applyTypeDefaults(); renderAll(); });

function selectedFolders(){
  const cfg = TYPE_CONFIG[els.type.value];
  const out = [];
  [els.chk1, els.chk2, els.chk3].forEach((el,i)=>{ if(el.checked) out.push(cfg.checks[i].folder[LANG]); });
  return [...new Set(out)];
}

function selectedLocalOnlyFolders(){
  const cfg = TYPE_CONFIG[els.type.value];
  const out = [];
  [els.chk1, els.chk2, els.chk3].forEach((el,i)=>{ if(el.checked && cfg.checks[i].localOnly) out.push(cfg.checks[i].folder[LANG]); });
  return [...new Set(out)];
}

function buildGitignore(){
  const localOnlyFolders = selectedLocalOnlyFolders();
  let content = GITIGNORE_BASE[LANG];
  if(localOnlyFolders.length){
    content += LANG==='en'
      ? '\n# Local-only folders (heavy or sensitive) — kept out of version control\n'
      : '\n# Pastas locais (pesadas ou sensíveis) — fora do controle de versão\n';
    localOnlyFolders.forEach(f=>{ content += `${f}/*\n!${f}/.gitkeep\n`; });
  }
  return content;
}

function buildAgentBody(d){
  return LANG==='en'
    ? `# ${d.name}\n\n${d.desc}\n\n## Stack & commands\n${d.stack || '(fill in: how to build, test, and run this project)'}\n\n## Limits — don't do this without asking\n${d.limits || '- (fill in)'}\n\n## See also\n- PROJECT.md — overview for humans\n- DECISIONS.md — decision history (update on every relevant decision)\n- TASKS.md — active tasks\n`
    : `# ${d.name}\n\n${d.desc}\n\n## Stack & comandos\n${d.stack || '(preencher: como buildar, testar e rodar este projeto)'}\n\n## Limites — o que não fazer sem perguntar\n${d.limits || '- (preencher)'}\n\n## Ver também\n- PROJECT.md — visão geral para humanos\n- DECISIONS.md — histórico de decisões (atualizar a cada decisão relevante)\n- TASKS.md — tarefas ativas\n`;
}

function buildFileMap(){
  const d = collectData();
  const cfg = TYPE_CONFIG[d.type];
  const date = todayStr(LANG);
  const slug = slugify(d.name);
  const files = {};

  const folders = selectedFolders();
  const localOnlySet = new Set(selectedLocalOnlyFolders());
  const folderList = folders.map(f=> localOnlySet.has(f)
    ? `- \`${f}/\` — ${LANG==='en' ? 'local only, see .gitignore' : 'só local, ver .gitignore'}`
    : `- \`${f}/\``).join('\n');

  if(LANG==='en'){
    files['README.md'] = `# ${d.name}\n\nIndex of this workspace:\n- \`PROJECT.md\` — overview and goal\n- \`DECISIONS.md\` — decision history\n- \`CONTEXT.md\` — accumulated context for the AI\n- \`TASKS.md\` — active tasks\n${folderList ? '\nFolders:\n'+folderList : ''}\n\n> The AI is a tool that extends human judgment, not a substitute for it. Relevant decisions go into DECISIONS.md.\n`;
    files['PROJECT.md'] = `# ${d.name}\n\n## Overview\n${d.desc}\n\n## Main goal\n${d.obj}\n\n## Project type\n${cfg.label[LANG]}\n\n## Stack\n${d.stack || '(fill in)'}\n\n## Status\n🟡 In definition\n\n---\nCreated on ${date} via workspace//kit.\n`;
    files['DECISIONS.md'] = `# Decisions — ${d.name}\n\nChronological record of decisions made in this project. Each entry should contain what, why, and discarded alternatives.\n\n## ${date}\n- **Decision:** —\n- **Reason:** —\n- **Alternatives considered:** —\n`;
    files['CONTEXT.md'] = `# Context — ${d.name}\n\nContext the AI should know to work well on this project: conventions, constraints, vocabulary, people involved.\n\n## Conventions\n- \n\n## Constraints\n- \n\n## Vocabulary / specific terms\n- \n`;
    files['TASKS.md'] = `# Tasks — ${d.name}\n\n## In progress\n- [ ] \n\n## Next\n- [ ] \n\n## Done\n- [x] Workspace created (${date})\n`;
  } else {
    files['README.md'] = `# ${d.name}\n\nÍndice deste workspace:\n- \`PROJECT.md\` — visão geral e objetivo\n- \`DECISIONS.md\` — histórico de decisões\n- \`CONTEXT.md\` — contexto acumulado para a IA\n- \`TASKS.md\` — tarefas ativas\n${folderList ? '\nPastas:\n'+folderList : ''}\n\n> A IA é uma ferramenta que amplia julgamento humano, não um substituto para ele. Decisões relevantes vão para DECISIONS.md.\n`;
    files['PROJECT.md'] = `# ${d.name}\n\n## Visão geral\n${d.desc}\n\n## Objetivo principal\n${d.obj}\n\n## Tipo de projeto\n${cfg.label[LANG]}\n\n## Stack\n${d.stack || '(preencher)'}\n\n## Status\n🟡 Em definição\n\n---\nCriado em ${date} via workspace//kit.\n`;
    files['DECISIONS.md'] = `# Decisões — ${d.name}\n\nRegistro cronológico de decisões tomadas neste projeto. Cada entrada deve conter o quê, por quê, e alternativas descartadas.\n\n## ${date}\n- **Decisão:** —\n- **Motivo:** —\n- **Alternativas consideradas:** —\n`;
    files['CONTEXT.md'] = `# Contexto — ${d.name}\n\nContexto que a IA deve conhecer para trabalhar bem neste projeto: convenções, restrições, vocabulário, pessoas envolvidas.\n\n## Convenções\n- \n\n## Restrições\n- \n\n## Vocabulário / termos específicos\n- \n`;
    files['TASKS.md'] = `# Tarefas — ${d.name}\n\n## Em andamento\n- [ ] \n\n## Próximas\n- [ ] \n\n## Concluídas\n- [x] Workspace criado (${date})\n`;
  }

  folders.forEach(f => { files[`${f}/.gitkeep`] = ''; });
  if(cfg.extraFile){ files[cfg.extraFile.path[LANG]] = cfg.extraFile.build(d.name, LANG); }
  files['.gitignore'] = buildGitignore();

  const agentBody = buildAgentBody(d);
  const wantsAgentsmd = els.agAgentsmd.checked;
  if(els.agClaude.checked){
    files['CLAUDE.md'] = wantsAgentsmd
      ? (LANG==='en'
          ? `@AGENTS.md\n\n## Specific to Claude Code / Cowork\n- (add rules exclusive to this agent here, e.g. use plan mode before structural changes)\n`
          : `@AGENTS.md\n\n## Específico para Claude Code / Cowork\n- (adicione aqui regras exclusivas deste agente, ex: usar plan mode antes de mudanças estruturais)\n`)
      : agentBody;
  }
  if(wantsAgentsmd){ files['AGENTS.md'] = agentBody; }
  if(els.agCursor.checked){
    files[`.cursor/rules/${slug}.mdc`] = LANG==='en'
      ? `---\ndescription: Rules for the ${d.name} project\nglobs:\nalwaysApply: true\n---\n\n${agentBody}`
      : `---\ndescription: Regras do projeto ${d.name}\nglobs:\nalwaysApply: true\n---\n\n${agentBody}`;
  }
  if(els.agCopilot.checked){ files['.github/copilot-instructions.md'] = agentBody; }
  if(els.agGemini.checked){ files['GEMINI.md'] = agentBody; }
  if(els.agWindsurf.checked){ files[`.windsurf/rules/${slug}.md`] = agentBody; }
  if(els.agSkill.checked){ files[`.claude/skills/${slug}/SKILL.md`] = buildSkillFile(d, slug); }

  return {files, slug, name: d.name};
}

function buildTreeStructure(paths){
  const root = {};
  paths.forEach(p=>{
    const parts = p.split('/');
    let node = root;
    parts.forEach((part,i)=>{
      const isLeaf = i === parts.length-1;
      if(!(part in node)) node[part] = isLeaf ? null : {};
      if(node[part] !== null) node = node[part];
    });
  });
  return root;
}

function renderTreeNode(node, prefix, lines){
  const keys = Object.keys(node);
  keys.forEach((key,idx)=>{
    const isLast = idx === keys.length-1;
    const isFolder = node[key] !== null;
    const connector = isLast ? '└── ' : '├── ';
    const cls = isFolder ? 'folder' : 'file';
    const display = isFolder ? key + '/' : key;
    lines.push(`${prefix}${connector}<span class="${cls}">${display}</span>`);
    if(isFolder){
      renderTreeNode(node[key], prefix + (isLast ? '    ' : '│   '), lines);
    }
  });
}

function renderTree(){
  const {files, slug} = buildFileMap();
  const structure = buildTreeStructure(Object.keys(files));
  const lines = [`<span class="root">${slug}/</span>`];
  renderTreeNode(structure, '', lines);
  els.tree.innerHTML = lines.join('\n');
}

function renderPrompt(){
  const d = collectData();
  const cfg = TYPE_CONFIG[d.type];
  const agentFiles = [];
  if(els.agClaude.checked) agentFiles.push('CLAUDE.md');
  if(els.agAgentsmd.checked) agentFiles.push('AGENTS.md');
  if(els.agCursor.checked) agentFiles.push('.cursor/rules/');
  if(els.agCopilot.checked) agentFiles.push('.github/copilot-instructions.md');
  if(els.agGemini.checked) agentFiles.push('GEMINI.md');
  if(els.agWindsurf.checked) agentFiles.push('.windsurf/rules/');
  const agentList = agentFiles.length ? agentFiles.join(', ') : UI[LANG].agentListFallback;

  const text = LANG==='en'
    ? `You'll act as a working partner on this project: "${d.name}".

CONTEXT
${d.desc}
Main goal: ${d.obj}
Project type: ${cfg.label[LANG]}

HOW TO WORK
- Before taking any action, read ${agentList}, then PROJECT.md, CONTEXT.md, and DECISIONS.md in this folder.
- Every relevant decision we make should be logged in DECISIONS.md (what, why, discarded alternatives).
- Update TASKS.md as work progresses.
- You are a tool that extends my judgment — at points of strategic ambiguity, don't decide on your own: bring options and trade-offs for me to decide.
- Be explicit about what is fact, inference, or assumption.

Start by reviewing the workspace files and tell me what's missing before we begin.`
    : `Você vai atuar como parceiro de trabalho neste projeto: "${d.name}".

CONTEXTO
${d.desc}
Objetivo principal: ${d.obj}
Tipo de projeto: ${cfg.label[LANG]}

COMO TRABALHAR
- Antes de qualquer ação, leia ${agentList}, depois PROJECT.md, CONTEXT.md e DECISIONS.md nesta pasta.
- Toda decisão relevante que tomarmos deve ser registrada em DECISIONS.md (o quê, por quê, alternativas descartadas).
- Atualize TASKS.md conforme o trabalho avança.
- Você é uma ferramenta que amplia meu julgamento — em pontos de ambiguidade estratégica, não decida sozinho: traga opções e trade-offs para eu decidir.
- Seja explícito sobre o que é fato, inferência ou suposição.

Comece revisando os arquivos do workspace e me diga o que falta preencher antes de começarmos.`;

  els.prompt.value = text;
}

function renderAll(){ renderTree(); renderPrompt(); }

function applyStaticUI(){
  const t = UI[LANG];
  document.documentElement.lang = LANG==='en' ? 'en' : 'pt-BR';
  els.tagline.textContent = t.tagline;
  els.headerH1.textContent = t.h1;
  els.headerP.textContent = t.p;
  els.card01Title.textContent = t.card01;
  els.pnameLabel.textContent = t.pnameLabel;
  els.name.placeholder = t.pnamePh;
  els.ptypeLabel.textContent = t.ptypeLabel;
  els.pdescLabel.textContent = t.pdescLabel;
  els.desc.placeholder = t.pdescPh;
  els.pobjLabel.textContent = t.pobjLabel;
  els.obj.placeholder = t.pobjPh;
  els.checksTitle.textContent = t.checksTitle;
  els.card02Title.textContent = t.card02;
  els.card02Sub.textContent = t.card02sub;
  els.pstackLabel.textContent = t.pstackLabel;
  els.stack.placeholder = els.stack.placeholder || t.genericPh;
  els.plimitsLabel.textContent = t.plimitsLabel;
  els.card03Title.textContent = t.card03;
  els.card03Sub.textContent = t.card03sub;
  els.agClaudeLabel.textContent = t.agClaude;
  els.agAgentsmdLabel.textContent = t.agAgentsmd;
  els.agAgentsmdDesc.textContent = t.agAgentsmdDesc;
  els.agCursorLabel.textContent = t.agCursor;
  els.agCopilotLabel.textContent = t.agCopilot;
  els.agGeminiLabel.textContent = t.agGemini;
  els.agWindsurfLabel.textContent = t.agWindsurf;
  els.agSkillLabel.textContent = t.agSkill;
  els.infoBox.innerHTML = t.infoBox;
  els.card04Title.textContent = t.card04;
  els.btnZip.textContent = t.btnZip;
  els.card05Title.textContent = t.card05;
  els.btnCopy.textContent = t.btnCopy;
  els.promptHint.textContent = t.promptHint;
  els.langPt.classList.toggle('active', LANG==='pt');
  els.langEn.classList.toggle('active', LANG==='en');
}

function setLang(lang){
  LANG = lang;
  populateTypeSelect();
  applyTypeDefaults();
  applyStaticUI();
  renderAll();
}
els.langPt.addEventListener('click', ()=> setLang('pt'));
els.langEn.addEventListener('click', ()=> setLang('en'));

[els.name, els.desc, els.obj, els.stack, els.limits,
 els.chk1, els.chk2, els.chk3,
 els.agClaude, els.agAgentsmd, els.agCursor, els.agCopilot, els.agGemini, els.agWindsurf, els.agSkill
].forEach(el=> el.addEventListener('input', renderAll));

document.getElementById('btnCopy').addEventListener('click', ()=>{
  els.prompt.select();
  navigator.clipboard.writeText(els.prompt.value).then(()=>{
    const btn = document.getElementById('btnCopy');
    const old = btn.textContent;
    btn.textContent = UI[LANG].copied;
    setTimeout(()=>btn.textContent = old, 1500);
  });
});

document.getElementById('btnZip').addEventListener('click', async ()=>{
  const status = els.zipStatus;
  status.textContent = UI[LANG].zipGenerating;
  try{
    const {files, slug} = buildFileMap();
    const zip = new JSZip();
    const root = zip.folder(slug);
    Object.entries(files).forEach(([path, content])=>{ root.file(path, content); });
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${slug}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    status.textContent = UI[LANG].zipDone(slug);
  }catch(err){
    status.textContent = UI[LANG].zipError(err.message);
  }
});

setLang('en');
</script>
