<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
    --bg:#0D0F14;
    --panel:#161922;
    --panel2:#1C2029;
    --border:#2A2E3A;
    --text:#E8E6E1;
    --text-dim:#8B8F9C;
    --accent:#D4A24C;
    --accent2:#5FA8A0;
    --danger:#D4694C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px;}
  .lang-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    padding:5px 12px;
    border-radius:5px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .lang-btn:hover{opacity:.85;}
  .lang-btn.active{background:var(--accent);color:#141414;border-color:var(--accent);}

  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px;}
  .brand svg{display:block;}
  .cursor-blink{animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .wordmark{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:700;
    letter-spacing:.01em;
    margin-top:10px;
  }
  .wordmark .slash{color:var(--accent);}
  .tagline{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-top:4px;
  }

  header{margin-bottom:22px;text-align:center;}
  header h1{font-size:21px;margin:0 0 8px;font-weight:600;}
  header p{color:var(--text-dim);font-size:14px;margin:0 auto;line-height:1.55;max-width:620px;}

  .grid{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .col{flex:1 1 380px;min-width:320px;}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 6px;
  }
  .card .subhint{font-size:12px;color:var(--text-dim);line-height:1.5;margin:0 0 14px;}

  label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], textarea, select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px;
    resize:vertical;
  }
  textarea{min-height:64px;line-height:1.4;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .checks{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .check-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);}
  .check-row input{width:auto;accent-color:var(--accent);margin-top:2px;}
  .check-row .desc{display:block;font-size:11.5px;color:var(--text-dim);margin-top:1px;}

  pre#tree{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    line-height:1.65;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:14px 16px;
    white-space:pre;
    overflow-x:auto;
    color:var(--text-dim);
    margin:0;
    max-height:360px;
    overflow-y:auto;
  }
  pre#tree .folder{color:var(--accent);}
  pre#tree .file{color:var(--accent2);}
  pre#tree .root{color:var(--text);font-weight:700;}

  textarea#promptOut{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    min-height:230px;
    line-height:1.5;
    color:var(--text);
  }

  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    border-radius:6px;
    padding:10px 16px;
    border:1px solid transparent;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.85;}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);color:#141414;}
  .btn-secondary{background:transparent;border-color:var(--border);color:var(--text);}
  .hint{font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.5;}
  .status{font-size:12px;color:var(--accent2);margin-top:8px;min-height:16px;}

  .info-box{
    background:var(--panel2);
    border:1px solid var(--border);
    border-left:3px solid var(--accent2);
    border-radius:6px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
    margin-top:14px;
  }
  .info-box b{color:var(--text);}
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar">
    <button type="button" class="lang-btn" id="langPt">PT</button>
    <button type="button" class="lang-btn" id="langEn">EN</button>
  </div>

  <div class="brand">
    <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="8" width="30" height="38" rx="5" fill="#161922" stroke="#2A2E3A" stroke-width="1.5"/>
      <rect x="13" y="13" width="30" height="38" rx="5" fill="#161922" stroke="#5FA8A0" stroke-width="1.5"/>
      <rect x="6" y="18" width="30" height="38" rx="5" fill="#1C2029" stroke="#D4A24C" stroke-width="2"/>
      <text x="13" y="34" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#D4A24C">&gt;</text>
      <rect x="12" y="40" width="16" height="2.4" rx="1.2" fill="#8B8F9C"/>
      <rect x="12" y="45" width="10" height="2.4" rx="1.2" fill="#8B8F9C"/>
      <rect class="cursor-blink" x="24" y="45" width="6" height="2.4" rx="1" fill="#D4A24C"/>
    </svg>
    <div class="wordmark">workspace<span class="slash">//</span>kit</div>
    <div class="tagline" id="tagline"></div>
  </div>

  <header>
    <h1 id="headerH1"></h1>
    <p id="headerP"></p>
  </header>

  <div class="grid">
    <div class="col">
      <div class="card">
        <h2 id="card01Title"></h2>
        <label for="pname" id="pnameLabel"></label>
        <input type="text" id="pname">

        <label for="ptype" id="ptypeLabel"></label>
        <select id="ptype"></select>

        <label for="pdesc" id="pdescLabel"></label>
        <textarea id="pdesc" style="font-family:'Inter',sans-serif;font-size:14px;"></textarea>

        <label for="pobj" id="pobjLabel"></label>
        <input type="text" id="pobj">

        <label id="checksTitle" for="chk1"></label>
        <div class="checks" id="typeChecks">
          <div class="check-row"><input type="checkbox" id="chk1"><label id="chk1label" for="chk1" style="margin:0"></label></div>
          <div class="check-row"><input type="checkbox" id="chk2"><label id="chk2label" for="chk2" style="margin:0"></label></div>
          <div class="check-row"><input type="checkbox" id="chk3"><label id="chk3label" for="chk3" style="margin:0"></label></div>
        </div>
      </div>

      <div class="card">
        <h2 id="card02Title"></h2>
        <p class="subhint" id="card02Sub"></p>
        <label for="pstack" id="pstackLabel"></label>
        <textarea id="pstack"></textarea>

        <label for="plimits" id="plimitsLabel"></label>
        <textarea id="plimits"></textarea>
      </div>

      <div class="card">
        <h2 id="card03Title"></h2>
        <p class="subhint" id="card03Sub"></p>
        <div class="checks">
          <div class="check-row"><input type="checkbox" id="agClaude" checked><label style="margin:0" for="agClaude"><span id="agClaudeLabel"></span> <span class="desc">CLAUDE.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agAgentsmd" checked><label style="margin:0" for="agAgentsmd"><span id="agAgentsmdLabel"></span> <span class="desc" id="agAgentsmdDesc"></span></label></div>
          <div class="check-row"><input type="checkbox" id="agCursor"><label style="margin:0" for="agCursor"><span id="agCursorLabel"></span> <span class="desc">.cursor/rules/{slug}.mdc</span></label></div>
          <div class="check-row"><input type="checkbox" id="agCopilot"><label style="margin:0" for="agCopilot"><span id="agCopilotLabel"></span> <span class="desc">.github/copilot-instructions.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agGemini"><label style="margin:0" for="agGemini"><span id="agGeminiLabel"></span> <span class="desc">GEMINI.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agWindsurf"><label style="margin:0" for="agWindsurf"><span id="agWindsurfLabel"></span> <span class="desc">.windsurf/rules/{slug}.md</span></label></div>
          <div class="check-row"><input type="checkbox" id="agSkill"><label style="margin:0" for="agSkill"><span id="agSkillLabel"></span> <span class="desc">.claude/skills/{slug}/SKILL.md</span></label></div>
        </div>
        <div class="info-box" id="infoBox"></div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2 id="card04Title"></h2>
        <pre id="tree"></pre>
        <div class="actions">
          <button class="btn-primary" id="btnZip"></button>
        </div>
        <div class="status" id="zipStatus"></div>
      </div>

      <div class="card">
        <h2 id="card05Title"></h2>
        <textarea id="promptOut" readonly></textarea>
        <div class="actions">
          <button class="btn-secondary" id="btnCopy"></button>
        </div>
        <div class="hint" id="promptHint"></div>
      </div>
    </div>
  </div>
</div>

<script>
[SCRIPT_BODY_IDENTICAL_TO_PROMOTED_V2_RELEASE_SEE_GIT_HISTORY]
</script>
</body>
</html>
