<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workspace//kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#131315;
    --panel:rgba(28,27,29,0.7);
    --panel-strong:rgba(28,27,29,0.55);
    --panel-solid:#1c1b1d;
    --card-border:rgba(255,255,255,0.06);
    --hairline:rgba(69,70,82,0.3);
    --input-border:#454652;
    --input-bg:#0e0e10;
    --text:#e5e1e4;
    --text-dim:#c6c5d5;
    --text-mute:#9aa0ab;
    --accent:#dba74e;
    --accent-ink:#0e0e10;
    --accent2:#5fa8a0;
    --danger:#d4694c;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    border-top:6px solid var(--accent);
    position:relative;
  }
  body::before{
    content:'';
    position:fixed;
    top:-10%;left:50%;
    width:900px;height:700px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(255,255,255,0.035), rgba(255,255,255,0) 70%);
    pointer-events:none;
    z-index:0;
  }
  .container{max-width:1152px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}

  a{color:inherit;}

  /* ---------- header ---------- */
  header.site-header{border-bottom:1px solid var(--hairline);position:relative;z-index:1;}
  .header-inner{
    display:flex;flex-direction:column;align-items:center;gap:20px;
    padding:36px 24px 26px;
  }
  .logo-mark{display:flex;align-items:center;}
  .logo-mark svg{display:block;height:32px;width:auto;overflow:visible;}

  .pill-nav{
    display:flex;flex-wrap:wrap;justify-content:center;gap:26px;
    padding:13px 26px;
    border-radius:9999px;
    border:1px solid var(--hairline);
    background:var(--panel-strong);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  .pill-link{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-dim);
    background:none;border:none;cursor:default;
    white-space:nowrap;
    line-height:1;
  }
  .pill-link svg{width:12px;height:12px;flex:none;}
  .pill-link.active{color:var(--accent);}

  .lang-row{
    display:flex;justify-content:center;align-items:center;gap:9px;
    padding:7px 10px;
    border:1px solid var(--hairline);
    border-radius:9999px;
    background:var(--panel-strong);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    width:fit-content;
  }
  .flag-btn{
    width:27px;height:19px;
    display:flex;align-items:center;justify-content:center;
    padding:0;
    border-radius:4px;
    border:1.5px solid transparent;
    background:transparent;
    cursor:pointer;
    opacity:.5;
    overflow:hidden;
    transition:opacity .15s ease, border-color .15s ease;
  }
  .flag-btn svg{width:100%;height:100%;display:block;}
  .flag-btn:hover{opacity:.8;}
  .flag-btn.active{opacity:1;border-color:var(--accent);}

  /* ---------- hero ---------- */
  .hero{padding:48px 24px 44px;text-align:center;}
  .hero h1{
    font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.3;
    margin:0 0 20px;color:var(--text);
  }
  .hero .hero-tag{
    font-size:17px;font-weight:600;color:var(--text-dim);
    max-width:640px;margin:0 auto 12px;line-height:1.55;
  }
  .hero .hero-desc{
    font-size:15px;font-weight:500;
    max-width:720px;margin:0 auto;line-height:1.6;
    color:var(--text-mute);
  }

  /* ---------- layout ---------- */
  main{padding:0 24px 84px;}
  .layout-grid{
    max-width:1152px;margin:0 auto;
    display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start;
  }
  @media (max-width: 880px){
    .layout-grid{grid-template-columns:1fr;}
    .sticky-card{position:static !important;}
  }

  .col-main{display:flex;flex-direction:column;gap:24px;min-width:0;}

  .card{
    background:var(--panel);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:28px;
    box-shadow:0 8px 32px rgba(0,0,0,.37);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;flex-direction:column;gap:24px;
  }
  .card-head-group{display:flex;flex-direction:column;gap:8px;}
  .card-head{display:flex;align-items:center;gap:12px;}
  .card-head .icon-wrap{
    width:26px;height:26px;flex:none;color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .card-head .icon-wrap svg{width:100%;height:100%;}
  .card h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;color:var(--text);}
  .card .subhint{font-size:12.5px;color:var(--text-mute);line-height:1.55;margin:0;padding-left:38px;}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .field{display:flex;flex-direction:column;gap:8px;}

  label.field-label, .field-label{
    font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-dim);
  }

  input[type=text], textarea, select{
    width:100%;
    background:var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:8px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    resize:vertical;
  }
  input::placeholder, textarea::placeholder{color:var(--text-mute);}
  textarea{min-height:60px;line-height:1.5;}
  #pdesc{min-height:88px;}
  #pstack, #plimits{font-family:'JetBrains Mono',monospace;font-size:12.5px;min-height:76px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--accent);outline-offset:1px;}

  select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    padding-right:38px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23c6c5d5' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
  }

  .checks{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .check-row{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--text);}
  .check-row input{width:auto;accent-color:var(--accent);margin-top:3px;flex:none;}
  .check-row .desc{display:block;font-size:11.5px;color:var(--text-mute);margin-top:1px;}

  /* agent config cards */
  .agent-grid{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:12px;
  }
  .agent-card{
    position:relative;
    display:flex;flex-direction:column;gap:7px;
    padding:16px;
    min-width:0;
    min-height:108px;
    border:1px solid var(--input-border);
    border-radius:8px;
    background:rgba(255,255,255,0.015);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .agent-card:hover{border-color:var(--text-dim);}
  .agent-card.selected{
    border-color:var(--accent);
    background:rgba(219,167,78,0.08);
    box-shadow:inset 0 0 0 1px rgba(219,167,78,0.35);
  }
  .agent-card input{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
  .agent-card-name{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    letter-spacing:.05em;color:var(--text);
    overflow-wrap:break-word;word-break:break-word;
  }
  .agent-card.selected .agent-card-name{color:var(--accent);}
  .agent-card-desc{
    font-size:10.5px;color:var(--text-mute);line-height:1.45;
    overflow-wrap:break-word;word-break:break-word;
  }

  .info-box{
    background:var(--input-bg);
    border:1px solid var(--hairline);
    border-left:3px solid var(--accent2);
    border-radius:8px;
    padding:14px 16px;
    font-size:12.5px;
    color:var(--text-mute);
    line-height:1.6;
  }
  .info-box b{color:var(--text);}

  /* sticky preview sidebar */
  .sticky-card{position:sticky;top:24px;padding:0;gap:0;overflow:hidden;display:flex;flex-direction:column;}
  .preview-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;
    background:#232225;
    border-bottom:1px solid var(--hairline);
  }
  .preview-head .left{display:flex;align-items:center;gap:9px;}
  .preview-head .icon-wrap{width:15px;height:15px;color:var(--accent);}
  .preview-head .icon-wrap svg{width:100%;height:100%;}
  .preview-head h2{font-size:13.5px;font-weight:700;margin:0;color:var(--text);}
  .traffic-dots{display:flex;gap:6px;}
  .traffic-dots span{width:9px;height:9px;border-radius:50%;display:block;}
  .traffic-dots span:nth-child(1){background:rgba(255,180,171,.35);}
  .traffic-dots span:nth-child(2){background:rgba(0,210,255,.3);}
  .traffic-dots span:nth-child(3){background:rgba(94,106,210,.35);}

  .preview-body{
    background:rgba(14,14,16,0.35);
    padding:22px;
    flex:1 1 auto;
    display:flex;flex-direction:column;gap:20px;
  }

  pre#tree{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    line-height:1.7;
    margin:0;
    white-space:pre;
    color:var(--text-mute);
  }
  pre#tree .folder{color:var(--accent);}
  pre#tree .file{color:var(--accent2);}
  pre#tree .root{color:var(--text);font-weight:700;}

  .prompt-block{border-top:1px solid var(--hairline);padding-top:18px;}
  .prompt-label-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .prompt-label-row .field-label{font-size:10.5px;}
  #btnCopy{
    background:none;border:none;color:var(--accent);
    font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;padding:0;
  }
  #btnCopy:hover{opacity:.8;}

  textarea#promptOut{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    min-height:160px;
    line-height:1.55;
    color:var(--text-dim);
    background:rgba(0,0,0,0.5);
    border-color:var(--hairline);
  }
  .hint{font-size:11.5px;color:var(--text-mute);margin-top:9px;line-height:1.55;}

  .preview-footer{
    border-top:1px solid var(--hairline);
    background:rgba(14,14,16,0.5);
    padding:18px 22px 22px;
  }
  .btn-block{width:100%;}
  button{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:800;
    border-radius:10px;
    padding:13px 18px;
    border:1px solid transparent;
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:hover{opacity:.9;}
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{
    background:var(--accent);color:var(--accent-ink);
    box-shadow:0 20px 25px -5px rgba(154,154,154,.2), 0 8px 10px -6px rgba(126,126,126,.2);
  }
  .status{font-size:11.5px;color:var(--accent2);margin-top:10px;min-height:16px;text-align:center;}

  /* ---------- footer ---------- */
  footer.site-footer{
    border-top:1px solid var(--hairline);
    background:rgba(19,19,21,0.5);
    position:relative;z-index:1;
  }
  .footer-inner{
    max-width:1152px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
    padding:34px 24px;
  }
  .footer-inner .brand-line{
    font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--text-dim);
  }
  .footer-links{display:flex;gap:26px;}
  .footer-links a{
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-dim);text-decoration:none;
  }
  .footer-links a:hover{color:var(--accent);}

  .badge-note{
    max-width:1152px;margin:0 auto;padding:14px 24px 0;
    font-size:11.5px;color:var(--text-mute);text-align:center;
  }
</style>
</head>

function slugify(s){
  return (s || 'new-project')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/(^-|-$)/g,'') || 'new-project';
}

    opt.value = key; opt.textContent = cfg.label[LANG];
    els.kit.appendChild(opt);
  });
  if(prevValue && KIT_CONFIG[prevValue]) els.kit.value = prevValue;
}

function applyKitDefaults(){
  const cfg = KIT_CONFIG[els.kit.value];
  [els.chk1, els.chk2, els.chk3].forEach((el,i)=>{ el.checked = cfg.defaults[i]; });
  [els.chk1label, els.chk2label, els.chk3label].forEach((el,i)=>{
    const base = cfg.checks[i].label[LANG];
    el.textContent = cfg.checks[i].localOnly ? `${base} ${UI[LANG].localOnlyTag}` : base;
  });
  els.stack.placeholder = cfg.stackPh[LANG];
  els.limits.placeholder = cfg.limitsPh[LANG];
}
els.kit.addEventListener('change', ()=>{ applyKitDefaults(); renderAll(); });

function selectedFolders(){
  const cfg = KIT_CONFIG[els.kit.value];
  const out = [];
  [els.chk1, els.chk2, els.chk3].forEach((el,i)=>{ if(el.checked) out.push(cfg.checks[i].folder[LANG]); });
  return [...new Set(out)];
}

function selectedLocalOnlyFolders(){
  const cfg = KIT_CONFIG[els.kit.value];
  const out = [];
  [els.chk1, els.chk2, els.chk3].forEach((el,i)=>{ if(el.checked && cfg.checks[i].localOnly) out.push(cfg.checks[i].folder[LANG]); });
  return [...new Set(out)];
}

function buildGitignore(){
  const localOnlyFolders = selectedLocalOnlyFolders();
  let content = GITIGNORE_BASE[LANG];
  if(localOnlyFolders.length){
    content += LANG==='en'
      ? '\n# Local-only folders (heavy or sensitive) — kept out of version control\n'
      : '\n# Pastas locais (pesadas ou sensíveis) — fora do controle de versão\n';
    localOnlyFolders.forEach(f=>{ content += `${f}/*\n!${f}/.gitkeep\n`; });
  }
  return content;
}

function buildAgentBody(d){
  return LANG==='en'
    ? `# ${d.name}\n\n${d.desc}\n\n## Stack & commands\n${d.stack || '(fill in: how to build, test, and run this project)'}\n\n## Limits — don't do this without asking\n${d.limits || '- (fill in)'}\n\n## See also\n- PROJECT.md — overview for humans\n- DECISIONS.md — decision history (update on every relevant decision)\n- TASKS.md — active tasks\n`
    : `# ${d.name}\n\n${d.desc}\n\n## Stack & comandos\n${d.stack || '(preencher: como buildar, testar e rodar este projeto)'}\n\n## Limites — o que não fazer sem perguntar\n${d.limits || '- (preencher)'}\n\n## Ver também\n- PROJECT.md — visão geral para humanos\n- DECISIONS.md — histórico de decisões (atualizar a cada decisão relevante)\n- TASKS.md — tarefas ativas\n`;
}

function buildSkillFile(d, slug){
  return LANG==='en'
    ? `---\nname: ${slug}\ndescription: Support skill for the ${d.name} project. Use when you need context or routines specific to this project.\n---\n\n# ${d.name} — support skill\n\nReusable instructions and procedures for recurring tasks in this project.\n\n## When to use\n- (fill in: in which situations this skill should be loaded)\n\n## Procedure\n1. \n2. \n3. \n`
    : `---\nname: ${slug}\ndescription: Skill de apoio para o projeto ${d.name}. Use quando precisar de contexto ou rotinas específicas deste projeto.\n---\n\n# ${d.name} — skill de apoio\n\nInstruções e procedimentos reutilizáveis para tarefas recorrentes deste projeto.\n\n## Quando usar\n- (preencher: em que situações esta skill deve ser carregada)\n\n## Procedimento\n1. \n2. \n3. \n`;
}

function collectData(){
  const t = UI[LANG];
  return {
    name: els.name.value.trim() || t.newProject,
    kit: els.kit.value,
    desc: els.desc.value.trim() || t.fillIn,
    obj: els.obj.value.trim() || t.fillIn,
    stack: els.stack.value.trim(),
    limits: els.limits.value.trim(),
  };
}

function buildFileMap(){
  const d = collectData();
  const cfg = KIT_CONFIG[d.kit];
  const date = todayStr(LANG);
  const slug = slugify(d.name);
  const files = {};

  const folders = selectedFolders();
  const localOnlySet = new Set(selectedLocalOnlyFolders());
  const folderList = folders.map(f=> localOnlySet.has(f)
    ? `- \`${f}/\` — ${LANG==='en' ? 'local only, see .gitignore' : 'só local, ver .gitignore'}`
    : `- \`${f}/\``).join('\n');

  if(LANG==='en'){
    files['README.md'] = `# ${d.name}\n\nIndex of this workspace:\n- \`PROJECT.md\` — overview and goal\n- \`DECISIONS.md\` — decision history\n- \`CONTEXT.md\` — accumulated context for the AI\n- \`TASKS.md\` — active tasks\n${folderList ? '\nFolders:\n'+folderList : ''}\n\n> The AI is a tool that extends human judgment, not a substitute for it. Relevant decisions go into DECISIONS.md.\n`;
    files['PROJECT.md'] = `# ${d.name}\n\n## Overview\n${d.desc}\n\n## Main goal\n${d.obj}\n\n## Project type\n${cfg.label[LANG]}\n\n## Stack\n${d.stack || '(fill in)'}\n\n## Status\n🟡 In definition\n\n---\nCreated on ${date} via workspace//kit.\n`;
    files['DECISIONS.md'] = `# Decisions — ${d.name}\n\nChronological record of decisions made in this project. Each entry should contain what, why, and discarded alternatives.\n\n## ${date}\n- **Decision:** —\n- **Reason:** —\n- **Alternatives considered:** —\n`;
    files['CONTEXT.md'] = `# Context — ${d.name}\n\nContext the AI should know to work well on this project: conventions, constraints, vocabulary, people involved.\n\n## Conventions\n- \n\n## Constraints\n- \n\n## Vocabulary / specific terms\n- \n`;
    files['TASKS.md'] = `# Tasks — ${d.name}\n\n## In progress\n- [ ] \n\n## Next\n- [ ] \n\n## Done\n- [x] Workspace created (${date})\n`;
  } else {
    files['README.md'] = `# ${d.name}\n\nÍndice deste workspace:\n- \`PROJECT.md\` — visão geral e objetivo\n- \`DECISIONS.md\` — histórico de decisões\n- \`CONTEXT.md\` — contexto acumulado para a IA\n- \`TASKS.md\` — tarefas ativas\n${folderList ? '\nPastas:\n'+folderList : ''}\n\n> A IA é uma ferramenta que amplia julgamento humano, não um substituto para ele. Decisões relevantes vão para DECISIONS.md.\n`;
    files['PROJECT.md'] = `# ${d.name}\n\n## Visão geral\n${d.desc}\n\n## Objetivo principal\n${d.obj}\n\n## Tipo de projeto\n${cfg.label[LANG]}\n\n## Stack\n${d.stack || '(preencher)'}\n\n## Status\n🟡 Em definição\n\n---\nCriado em ${date} via workspace//kit.\n`;
    files['DECISIONS.md'] = `# Decisões — ${d.name}\n\nRegistro cronológico de decisões tomadas neste projeto. Cada entrada deve conter o quê, por quê, e alternativas descartadas.\n\n## ${date}\n- **Decisão:** —\n- **Motivo:** —\n- **Alternativas consideradas:** —\n`;
    files['CONTEXT.md'] = `# Contexto — ${d.name}\n\nContexto que a IA deve conhecer para trabalhar bem neste projeto: convenções, restrições, vocabulário, pessoas envolvidas.\n\n## Convenções\n- \n\n## Restrições\n- \n\n## Vocabulário / termos específicos\n- \n`;
    files['TASKS.md'] = `# Tarefas — ${d.name}\n\n## Em andamento\n- [ ] \n\n## Próximas\n- [ ] \n\n## Concluídas\n- [x] Workspace criado (${date})\n`;
  }

  folders.forEach(f => { files[`${f}/.gitkeep`] = ''; });
  if(cfg.extraFile){ files[cfg.extraFile.path[LANG]] = cfg.extraFile.build(d.name, LANG); }
  files['.gitignore'] = buildGitignore();

  const agentBody = buildAgentBody(d);
  const wantsAgentsmd = els.agAgentsmd.checked;
  if(els.agClaude.checked){
    files['CLAUDE.md'] = wantsAgentsmd
      ? (LANG==='en'
          ? `@AGENTS.md\n\n## Specific to Claude Code / Cowork\n- (add rules exclusive to this agent here, e.g. use plan mode before structural changes)\n`
          : `@AGENTS.md\n\n## Específico para Claude Code / Cowork\n- (adicione aqui regras exclusivas deste agente, ex: usar plan mode antes de mudanças estruturais)\n`)
      : agentBody;
  }
  if(wantsAgentsmd){ files['AGENTS.md'] = agentBody; }
  if(els.agCursor.checked){
    files[`.cursor/rules/${slug}.mdc`] = LANG==='en'
      ? `---\ndescription: Rules for the ${d.name} project\nglobs:\nalwaysApply: true\n---\n\n${agentBody}`
      : `---\ndescription: Regras do projeto ${d.name}\nglobs:\nalwaysApply: true\n---\n\n${agentBody}`;
  }
  if(els.agCopilot.checked){ files['.github/copilot-instructions.md'] = agentBody; }
  if(els.agGemini.checked){ files['GEMINI.md'] = agentBody; }
  if(els.agWindsurf.checked){ files[`.windsurf/rules/${slug}.md`] = agentBody; }
  if(els.agSkill.checked){ files[`.claude/skills/${slug}/SKILL.md`] = buildSkillFile(d, slug); }

  return {files, slug, name: d.name};
}

function buildTreeStructure(paths){
  const root = {};
  paths.forEach(p=>{
    const parts = p.split('/');
    let node = root;
    parts.forEach((part,i)=>{
      const isLeaf = i === parts.length-1;
      if(!(part in node)) node[part] = isLeaf ? null : {};
      if(node[part] !== null) node = node[part];
    });
  });
  return root;
}

function renderTreeNode(node, prefix, lines){
  const keys = Object.keys(node);
  keys.forEach((key,idx)=>{
    const isLast = idx === keys.length-1;
    const isFolder = node[key] !== null;
    const connector = isLast ? '└── ' : '├── ';
    const cls = isFolder ? 'folder' : 'file';
    const display = isFolder ? key + '/' : key;
    lines.push(`${prefix}${connector}<span class="${cls}">${display}</span>`);
    if(isFolder){
      renderTreeNode(node[key], prefix + (isLast ? '    ' : '│   '), lines);
    }
  });
}

function renderTree(){
  const {files, slug} = buildFileMap();
  const structure = buildTreeStructure(Object.keys(files));
  const lines = [`<span class="root">${slug}/</span>`];
  renderTreeNode(structure, '', lines);
  els.tree.innerHTML = lines.join('\n');
}

function renderPrompt(){
  const d = collectData();
  const cfg = KIT_CONFIG[d.kit];
  const agentFiles = [];
  if(els.agClaude.checked) agentFiles.push('CLAUDE.md');
  if(els.agAgentsmd.checked) agentFiles.push('AGENTS.md');
  if(els.agCursor.checked) agentFiles.push('.cursor/rules/');
  if(els.agCopilot.checked) agentFiles.push('.github/copilot-instructions.md');
  if(els.agGemini.checked) agentFiles.push('GEMINI.md');
  if(els.agWindsurf.checked) agentFiles.push('.windsurf/rules/');
  const agentList = agentFiles.length ? agentFiles.join(', ') : UI[LANG].agentListFallback;

  const text = LANG==='en'
    ? `You'll act as a working partner on this project: "${d.name}".

CONTEXT
${d.desc}
Main goal: ${d.obj}
Project type: ${cfg.label[LANG]}

HOW TO WORK
- Before taking any action, read ${agentList}, then PROJECT.md, CONTEXT.md, and DECISIONS.md in this folder.
- Every relevant decision we make should be logged in DECISIONS.md (what, why, discarded alternatives).
- Update TASKS.md as work progresses.
- You are a tool that extends my judgment — at points of strategic ambiguity, don't decide on your own: bring options and trade-offs for me to decide.
- Be explicit about what is fact, inference, or assumption.

Start by reviewing the workspace files and tell me what's missing before we begin.`
    : `Você vai atuar como parceiro de trabalho neste projeto: "${d.name}".

CONTEXTO
${d.desc}
Objetivo principal: ${d.obj}
Tipo de projeto: ${cfg.label[LANG]}

COMO TRABALHAR
- Antes de qualquer ação, leia ${agentList}, depois PROJECT.md, CONTEXT.md e DECISIONS.md nesta pasta.
- Toda decisão relevante que tomarmos deve ser registrada em DECISIONS.md (o quê, por quê, alternativas descartadas).
- Atualize TASKS.md conforme o trabalho avança.
- Você é uma ferramenta que amplia meu julgamento — em pontos de ambiguidade estratégica, não decida sozinho: traga opções e trade-offs para eu decidir.
- Seja explícito sobre o que é fato, inferência ou suposição.
- Este chat é em português, mas a documentação gerada (PROJECT.md, DECISIONS.md, etc.) deve continuar em inglês por padrão — só escreva a documentação em português se eu pedir isso explicitamente.

Comece revisando os arquivos do workspace e me diga o que falta preencher antes de começarmos.`;

  els.prompt.value = text;
}

function syncAgentCardStates(){
  document.querySelectorAll('.agent-card').forEach(card=>{
    const input = card.querySelector('input[type=checkbox]');
    if(input) card.classList.toggle('selected', input.checked);
  });
}

function renderAll(){ renderTree(); renderPrompt(); syncAgentCardStates(); }

  const t = UI[LANG];
  document.documentElement.lang = LANG==='en' ? 'en' : 'pt-BR';
  els.navGenerator.textContent = t.navGenerator;
  els.navTemplates.textContent = t.navTemplates;
  els.navHistory.textContent = t.navHistory;
  els.navSettings.textContent = t.navSettings;
  els.heroTag.textContent = t.heroTag;
  els.headerH1.textContent = t.h1;
  els.headerP.textContent = t.p;
  els.card01Title.textContent = t.card01;
  els.pnameLabel.textContent = t.pnameLabel;
  els.name.placeholder = t.pnamePh;
  els.pkitLabel.textContent = t.pkitLabel;
  els.pdescLabel.textContent = t.pdescLabel;
  els.desc.placeholder = t.pdescPh;
  els.pobjLabel.textContent = t.pobjLabel;
  els.obj.placeholder = t.pobjPh;
  els.checksTitle.textContent = t.checksTitle;
  els.card02Title.textContent = t.card02;
  els.card02Sub.textContent = t.card02sub;

  els.card05Title.textContent = t.card05;

  els.langEn.classList.toggle('active', LANG==='en');

function setLang(lang){
  LANG = lang;
  populateKitSelect();
  applyKitDefaults();
  applyStaticUI();
  renderAll();
}
els.langPt.addEventListener('click', ()=> setLang('pt'));
els.langEn.addEventListener('click', ()=> setLang('en'));

[els.name, els.desc, els.obj, els.stack, els.limits,
 els.chk1, els.chk2, els.chk3,
 els.agClaude, els.agAgentsmd, els.agCursor, els.agCopilot, els.agGemini, els.agWindsurf, els.agSkill
].forEach(el=> el.addEventListener('input', renderAll));

document.getElementById('btnCopy').addEventListener('click', ()=>{
  els.prompt.select();
  navigator.clipboard.writeText(els.prompt.value).then(()=>{
    const btn = document.getElementById('btnCopy');
    const old = btn.textContent;
    btn.textContent = UI[LANG].copied;
    setTimeout(()=>btn.textContent = old, 1500);
  });
});

document.getElementById('btnZip').addEventListener('click', async ()=>{
  const status = els.zipStatus;
  status.textContent = UI[LANG].zipGenerating;
  try{
    const {files, slug} = buildFileMap();
    const zip = new JSZip();
    const root = zip.folder(slug);
    Object.entries(files).forEach(([path, content])=>{ root.file(path, content); });
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${slug}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    status.textContent = UI[LANG].zipDone(slug);
  }catch(err){
    status.textContent = UI[LANG].zipError(err.message);
  }
});

setLang('en');
</script>
