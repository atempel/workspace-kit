services:
  # ── Dev environment — Claude Code (Node 20 + Python available) ──────────
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-workspace-kit
    volumes:
      # Project code (bind mount — editable from the host)
      - .:/workspace
      # Claude Code login/config (container home) — kept separate from
      # project config (.claude/) so it doesn't collide and can have its
      # own gitignore (see .gitignore).
      - ./.claude_global:/root/.claude
    environment:
      - COLORTERM=truecolor
      - TERM=xterm-256color
    # The dashboard is served from inside the container, so its port has to be
    # published or the host browser cannot reach it — 127.0.0.1 inside a
    # container is the container, not your machine.
    #
    #   4319  workspace-kit serve — the dashboard on / and the JSON API on /api/*
    #   4330  Vite dev server, only needed when working on web/ itself
    #
    # Start it with `--host 0.0.0.0`; binding to 127.0.0.1 inside the container
    # publishes nothing:
    #
    #   npm --prefix web install && npm --prefix web run build   # once
    #   node bin/workspace-kit.js serve . --host 0.0.0.0
    #
    # then open http://localhost:4319 on the host. Still read-only and non-GET
    # is still refused; the wide bind reaches no further than this container's
    # published ports.
    ports:
      - "127.0.0.1:4319:4319"
      - "127.0.0.1:4330:4330"
    tty: true
    stdin_open: true
    working_dir: /workspace
