name: Sync specs to Issues

# One parent issue per docs/specs/*.md file, one sub-issue per Must-Have (P0)
# requirement in it. Matching is by a stable sync key stored in each issue's
# body, so rewording a requirement updates its issue instead of creating a
# duplicate, and retired (struck-through) bullets never become issues.
#
# The logic lives in .github/scripts/sync_specs_to_issues.py — run it with
# --dry-run locally to see exactly what a push would do. That file's docstring
# carries the full history, the sync-key format and the known limitations.
#
# TASKS.md is a lean index (heading + one-line pointer + spec/issue link per
# feature) and is deliberately NOT parsed here — the first version of this
# workflow synced its checkboxes 1:1 and created ~41 raw-titled issues
# (#36-76) from a single push.

on:
  push:
    paths:
      - 'docs/specs/*.md'
      - '.github/scripts/sync_specs_to_issues.py'
    branches:
      - main
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync specs to issues and sub-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_specs_to_issues.py
